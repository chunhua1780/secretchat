name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Copy www to assets
      run: |
        mkdir -p platforms/android/app/src/main/assets/www
        cp www/index.html platforms/android/app/src/main/assets/www/index.html
        echo "Done! Checking..."
        grep "dis:lg" platforms/android/app/src/main/assets/www/index.html | head -1
    - name: Build APK
      run: |
        cd platforms/android
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Find APK
      run: find . -name "*.apk"
    - uses: actions/upload-artifact@v4
      with:
        name: GhostChat-APK
        path: '**/*.apk'
        retention-days: 30
