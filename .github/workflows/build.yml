name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install Cordova
      run: npm install -g cordova
    - name: Add Android Platform
      run: |
        cordova platform remove android || true
        cordova platform add android
    - name: Copy native files
      run: |
        cp platforms/android/app/src/main/AndroidManifest.xml /tmp/manifest_backup.xml
        cp -r platforms/android/app/src/main/res/drawable/icon_*.xml /tmp/
        cp platforms/android/app/src/main/java/com/secretchat/app/IconSwitcher.java /tmp/
    - name: Restore native files after platform add
      run: |
        cp /tmp/manifest_backup.xml platforms/android/app/src/main/AndroidManifest.xml
        cp /tmp/icon_*.xml platforms/android/app/src/main/res/drawable/
        mkdir -p platforms/android/app/src/main/java/com/secretchat/app/
        cp /tmp/IconSwitcher.java platforms/android/app/src/main/java/com/secretchat/app/
    - name: Build APK
      run: cordova build android
    - name: Find APK
      run: find . -name "*.apk"
    - uses: actions/upload-artifact@v4
      with:
        name: GhostChat-APK
        path: '**/*.apk'
        retention-days: 30
